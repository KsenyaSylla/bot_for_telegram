image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2

stages:
  - test
  - deploy

before_script:
  - apk add --no-cache docker-compose curl

test:
  stage: test
  script:
    - echo "⚙️ Запускаем только БД"
    - docker-compose up -d db
    - echo "⏳ Ждём готовности БД..."
    - bash -c '
        for i in {1..15}; do
          if docker exec postgres_db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
            echo "✅ БД готова"
            break
          else
            echo "⏱ Попытка $i — жду..."
            sleep 5
          fi
        done
      '
    - echo "🔍 Проверка — пуста ли таблица"
    - bash -c '
        if docker exec -e PGPASSWORD=$POSTGRES_PASSWORD postgres_db psql -U $POSTGRES_USER -d $POSTGRES_DB -tAc "SELECT count(*) FROM users;" | grep -q "^0"; then
          echo "📥 Пусто — загружаем данные из CSV"
          docker exec -e PGPASSWORD=$POSTGRES_PASSWORD postgres_db psql -U $POSTGRES_USER -d $POSTGRES_DB -f /docker-entrypoint-initdb.d/init-db.sql
        else
          echo "✅ Таблица не пуста, пропускаем импорт"
        fi
      '
    - echo "Погнали дальше"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy:
  stage: deploy
  script:
    - echo "Запускаем бота и апи"
    - docker-compose up -d --build defects_bot fastapi_service
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  needs:
    - job: test
      artifacts: false
